blueprint:
  name: Dwellant — waiting list digest notification
  description: >-
    Notify once per poll when the waiting list changes (aggregated, no spam).
    Fires on dwellant_packages_update when new packages arrived.
  domain: automation
  input:
    notify_service:
      name: Notification service
      selector:
        text:
    sensor_entity:
      name: Dwellant sensor
      selector:
        entity:
          domain: sensor

trigger:
  - platform: event
    event_type: dwellant_packages_update

condition:
  - condition: template
    value_template: "{{ trigger.event.data.arrived_count > 0 }}"

action:
  - service: !input notify_service
    data:
      title: "Dwellant: {{ trigger.event.data.available_count }} package(s) waiting"
      message: "{{ trigger.event.data.arrived_count }} new package(s) for {{ trigger.event.data.email }}."
